function budgetDi(c){ const b = Number(c && c.budget_mensile); return b > 0 ? b : 0; }
function campoBudgetHtml(c){
  if (!S.budgetOk){
    return '<label class="f">Budget mensile</label><div class="hint">Per usare i budget serve un\u2019operazione una tantum su Supabase (SQL Editor): ' +
      '<code>alter table public.categorie_conto add column if not exists budget_mensile numeric(12,2);</code> ' +
      'Dopo averla eseguita, ricarica l\u2019app.</div>';
  }
  const b = budgetDi(c);
  return '<div id="c-budget-box"><label class="f" for="c-budget">Budget mensile in € (facoltativo, solo uscite)</label>' +
    '<input id="c-budget" type="text" inputmode="decimal" placeholder="es. 300" value="' + (b ? esc(String(b).replace('.', ',')) : '') + '">' +
    '<div class="hint">In Home vedrai quanto hai speso rispetto a questo limite e un avviso quando lo superi. Lascia vuoto per nessun limite.</div></div>';
}
function budgetHtml(movMese, mk){
  const cats = S.categorie.filter(c => c.tipo === 'uscita' && budgetDi(c) > 0);
  if (!cats.length) return '';
  const speso = {};
  for (const m of movMese){
    if (m.tipo === 'uscita' && m.categoria_id) speso[m.categoria_id] = (speso[m.categoria_id] || 0) + Number(m.importo || 0);
  }
  const righe = cats.map(c => { const b = budgetDi(c), s = speso[c.id] || 0; return {c: c, b: b, s: s, p: s / b * 100}; })
    .sort((x, y) => y.p - x.p);
  const sfora = righe.filter(r => r.p > 100).length;
  const vicine = righe.filter(r => r.p >= 80 && r.p <= 100).length;
  const totB = righe.reduce((a, r) => a + r.b, 0), totS = righe.reduce((a, r) => a + r.s, 0);
  const colore = (p) => p > 100 ? 'var(--red)' : p >= 80 ? '#f0a500' : 'var(--green)';
  const avviso = sfora
    ? '<div class="bover">⚠️ ' + (sfora === 1 ? 'Un budget superato' : sfora + ' budget superati') + ' in ' + esc(monthLabel(mk)) + '</div>'
    : vicine ? '<div class="bwarn">🟡 ' + (vicine === 1 ? 'Una categoria è' : vicine + ' categorie sono') + ' vicin' + (vicine === 1 ? 'a' : 'e') + ' al limite (oltre l\u201980%)</div>' : '';
  return '<div class="card"><h2>Budget · ' + esc(monthLabel(mk)) + '</h2>' + avviso +
    righe.map(r =>
      '<div class="row-item"><div class="emoji">' + esc(r.c.emoji) + '</div><div class="row-main">' +
      '<div class="row-t">' + esc(r.c.nome) + '</div>' +
      '<div class="prog"><i style="width:' + Math.max(r.s > 0 ? 3 : 0, Math.min(100, Math.round(r.p))) + '%;background:' + colore(r.p) + '"></i></div>' +
      '<div class="row-s" style="color:' + (r.p > 100 ? 'var(--red)' : 'var(--ink2)') + '">' +
        (r.p > 100 ? 'oltre di ' + fmtMoney(r.s - r.b) : 'restano ' + fmtMoney(r.b - r.s)) + ' · ' + Math.round(r.p) + '%</div></div>' +
      '<div class="row-a">' + fmtMoney(r.s) + '<small>su ' + fmtMoney(r.b) + '</small></div></div>').join('') +
    '<div class="hint" style="margin-top:8px">In totale per le categorie con budget: ' + fmtMoney(totS) + ' su ' + fmtMoney(totB) + '.</div></div>';
}
/** Testo breve da mostrare dopo un salvataggio, se quella categoria e' vicina o oltre il budget del mese. */
function avvisoBudget(catId, mese){
  const c = catById(catId), b = budgetDi(c);
  if (!c || !b || c.tipo !== 'uscita') return '';
  const speso = S.movimenti.filter(m => m.tipo === 'uscita' && m.categoria_id === c.id && (m.mese || monthKey(m.data)) === mese)
    .reduce((a, m) => a + Number(m.importo || 0), 0);
  if (speso > b) return '⚠️ Budget “' + c.nome + '” superato di ' + fmtMoney(speso - b);
  if (speso >= b * 0.8) return '🟡 Budget “' + c.nome + '” al ' + Math.round(speso / b * 100) + '%';
  return '';
}

/* ---- F) Importazione da CSV ---- */
const ALIAS_CSV = {
  data: ['data', 'date', 'data operazione', 'data contabile', 'data valuta', 'data movimento'],
  importo: ['importo', 'amount', 'valore', 'totale', 'importo euro', 'importo eur'],
  tipo: ['tipo', 'segno'],
  categoria: ['categoria', 'category'],
  descrizione: ['descrizione', 'description', 'causale', 'dettaglio', 'operazione', 'descrizione operazione'],
  fornitore: ['fornitore', 'beneficiario', 'esercente', 'controparte', 'merchant'],
  note: ['note', 'nota', 'notes']
};
const ALIAS_COL_ENTRATE = ['entrate', 'entrata', 'accrediti', 'accredito', 'avere'];
const ALIAS_COL_USCITE = ['uscite', 'uscita', 'addebiti', 'addebito', 'dare'];

function normIntestazione(x){
  return String(x == null ? '' : x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}
/** Legge un CSV: riconosce ; , o tabulazione e le virgolette. Restituisce righe di celle. */
function csvParse(testo){
  const t = String(testo || '').replace(/^\ufeff/, '');
  const prima = t.split(/\r?\n/, 1)[0] || '';
  const conta = (ch) => prima.split(ch).length - 1;
  let sep = ';', best = conta(';');
  if (conta(',') > best){ sep = ','; best = conta(','); }
  if (conta('\t') > best){ sep = '\t'; }
  const righe = [];
  let riga = [], cella = '', dentro = false;
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (dentro){
      if (ch === '"'){ if (t[i + 1] === '"'){ cella += '"'; i++; } else dentro = false; }
      else cella += ch;
    } else if (ch === '"') dentro = true;
    else if (ch === sep){ riga.push(cella); cella = ''; }
    else if (ch === '\n' || ch === '\r'){
      if (ch === '\r' && t[i + 1] === '\n') i++;
      riga.push(cella); cella = ''; righe.push(riga); riga = [];
    } else cella += ch;
  }
  if (cella !== '' || riga.length){ riga.push(cella); righe.push(riga); }
  return righe.filter(r => r.some(x => String(x).trim() !== ''));
}
function parseDataCsv(raw){
  const s = String(raw == null ? '' : raw).trim().split(/[T\s]/)[0];
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s), y, mo, d;
  if (m){ y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/.exec(s);
    if (!m) return null;
    d = +m[1]; mo = +m[2]; y = +m[3];
    if (m[3].length === 2) y += 2000;
  }
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
function parseImportoCsv(raw){
  let x = String(raw == null ? '' : raw).replace(/[\u00a0\s]/g, '').replace(/€|eur/ig, '').replace(/^\+/, '');
  if (/^\d[\d.,]*-$/.test(x)) x = '-' + x.slice(0, -1);              // "12,50-" = -12,50
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(x)) x = x.replace(/,/g, '');   // formato inglese 1,234.56
  return parseAmount(x);
}
function tipoDaCsv(v){
  const x = normIntestazione(v);
  if (!x) return null;
  if (/^(e|entrata|entrate|in|income|accredito|avere)\b/.test(x)) return 'entrata';
  if (/^(u|uscita|uscite|out|spesa|addebito|dare)\b/.test(x)) return 'uscita';
  return null;
}
function chiaveImport(r){ return [r.tipo, r.data, Number(r.importo).toFixed(2), String(r.descrizione || '').trim().toLowerCase()].join('|'); }

/** Trasforma il testo del CSV in movimenti pronti, segnando doppioni e righe da scartare. */
function analizzaCsv(testo, opz){
  opz = opz || {};
  const grezze = csvParse(testo);
  if (grezze.length < 2) return {errore: 'Il file è vuoto o contiene solo l\u2019intestazione.'};
  if (grezze.length > 3001) return {errore: 'Il file ha più di 3000 righe: dividilo in due parti e importale una alla volta.'};
  const head = grezze[0].map(normIntestazione);
  const idx = {};
  for (const k of Object.keys(ALIAS_CSV)){
    for (const a of ALIAS_CSV[k]){ const i = head.indexOf(a); if (i >= 0){ idx[k] = i; break; } }
  }
  const trova = (lista) => { for (const a of lista){ const i = head.indexOf(a); if (i >= 0) return i; } return null; };
  const colE = trova(ALIAS_COL_ENTRATE), colU = trova(ALIAS_COL_USCITE);
  if (idx.data == null || (idx.importo == null && colE == null && colU == null)){
    return {errore: 'Non riconosco le colonne. Nella prima riga servono almeno “data” e “importo” (oppure “entrate” e “uscite”). Trovate: ' + grezze[0].join(', ')};
  }
  const haTipo = idx.tipo != null || (idx.importo == null);
  const esistenti = new Set(S.movimenti.map(m => chiaveImport(m)));
  const out = {righe: [], scartate: [], catNuove: {}, haTipo: haTipo, errore: null};
  for (let n = 1; n < grezze.length; n++){
    const r = grezze[n], num = n + 1;
    const cella = (k) => idx[k] != null ? String(r[idx[k]] == null ? '' : r[idx[k]]).trim() : '';
    const data = parseDataCsv(cella('data'));
    if (!data){ out.scartate.push('Riga ' + num + ': data non valida (“' + cella('data') + '”)'); continue; }
    let imp = NaN, tipo = tipoDaCsv(cella('tipo'));
    if (idx.importo != null && cella('importo') !== ''){
      imp = parseImportoCsv(cella('importo'));
      if (!tipo){
        if (opz.tipoDef === 'uscita' || opz.tipoDef === 'entrata') tipo = opz.tipoDef;
        else if (imp < 0) tipo = 'uscita';
        else if (imp > 0) tipo = 'entrata';
      }
    } else {
      const e = colE != null ? parseImportoCsv(r[colE]) : NaN, u = colU != null ? parseImportoCsv(r[colU]) : NaN;
      if (e > 0){ imp = e; tipo = 'entrata'; } else if (u > 0){ imp = u; tipo = 'uscita'; }
    }
    if (!isFinite(imp) || Math.abs(imp) === 0 || !tipo){ out.scartate.push('Riga ' + num + ': importo non valido (“' + cella('importo') + '”)'); continue; }
    imp = Math.round(Math.abs(imp) * 100) / 100;
    if (imp > 99999999){ out.scartate.push('Riga ' + num + ': importo troppo grande'); continue; }
    const catNome = cella('categoria');
    let categoria_id = null;
    if (catNome){
      const c = S.categorie.find(x => x.nome.toLowerCase() === catNome.toLowerCase());
      if (c && c.tipo === tipo) categoria_id = c.id;
      else if (!c) out.catNuove[catNome.toLowerCase()] = {nome: catNome, tipo: tipo};
    }
    const riga = {tipo: tipo, data: data, importo: imp, categoria_id: categoria_id, catNome: catNome,
      descrizione: cella('descrizione') || null, fornitore: cella('fornitore') || null, note: cella('note') || null, riga: num};
    riga.dup = esistenti.has(chiaveImport(riga));
    out.righe.push(riga);
  }
  return out;
}
async function leggiTestoFile(file){
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', {fatal: true}).decode(buf); }
  catch (e){ return new TextDecoder('windows-1252').decode(buf); }
}

async function eseguiImport(){
  const imp = S.imp;
  if (!imp || imp.inCorso) return;
  const an = analizzaCsv(imp.testo, imp);
  if (an.errore) return;
  const daImp = an.righe.filter(r => imp.dup || !r.dup);
  if (!daImp.length){ toast('Niente da importare'); return; }
  imp.inCorso = true;
  const btn = document.getElementById('imp-vai');
  if (btn){ btn.disabled = true; btn.textContent = 'Importo…'; }
  let fatti = 0;
  try {
    const sb = client();
    // 1) categorie mancanti (solo se richiesto)
    const mappa = {};
    if (imp.creaCat){
      const nuove = Object.keys(an.catNuove).map(k => an.catNuove[k])
        .filter(c => !S.categorie.some(x => x.nome.toLowerCase() === c.nome.toLowerCase()));
      if (nuove.length){
        const rc = await sb.from('categorie_conto').insert(nuove.map(c => ({nome: c.nome, emoji: '🏷️', tipo: c.tipo, ordine: 500}))).select();
        if (rc.error) throw rc.error;
        (rc.data || []).forEach(c => { mappa[c.nome.toLowerCase()] = c.id; });
      }
    }
    // 2) movimenti, a gruppi di 200
    const payload = daImp.map(r => ({
      tipo: r.tipo, data: r.data, importo: r.importo,
      categoria_id: r.categoria_id || (r.catNome ? (mappa[r.catNome.toLowerCase()] || null) : null),
      descrizione: r.descrizione, fornitore: r.fornitore, note: r.note
    }));
    for (let i = 0; i < payload.length; i += 200){
      const gruppo = payload.slice(i, i + 200);
      const r = await sb.from('movimenti_conto').insert(gruppo);
      if (r.error) throw r.error;
      fatti += gruppo.length;
      if (btn) btn.textContent = 'Importo… ' + fatti + '/' + payload.length;
    }
    closeSheet(); invalidate();
    try { await reload(); } catch (e){ render(); }
    toast(fatti + (fatti === 1 ? ' movimento importato ✓' : ' movimenti importati ✓'));
  } catch (e){
    imp.inCorso = false;
    if (btn){ btn.disabled = false; btn.textContent = '✅ Riprova'; }
    toast((fatti ? 'Importati ' + fatti + ' movimenti, poi: ' : 'Importazione fallita: ') + msg(e));
    if (fatti){ invalidate(); try { await reload(); } catch (e2){} }
  }
}
document.getElementById('csv-input').addEventListener('change', async function(){
  const f = this.files && this.files[0];
  if (!f || !S.imp){ this.value = ''; return; }
  if (f.size > 2 * 1024 * 1024){ toast('File troppo grande (massimo 2 MB)'); this.value = ''; return; }
  try { S.imp.testo = await leggiTestoFile(f); S.imp.nomeFile = f.name; }
  catch (e){ toast('Non riesco a leggere il file'); this.value = ''; return; }
  this.value = '';
  mostraAnteprimaImport();
});

  else if (a === 'cat-edit'){ sheetCategoria(S.categorie.find(c => String(c.id) === String(id)) || null, 'uscita'); }
  else if (a === 'cat-save'){ await saveCategoria(id ? Number(id) : null); }
  else if (a === 'cat-del'){ await deleteCategoria(Number(id)); }
  else if (a === 'pass'){ sheetPassword(); }
  else if (a === 'config'){ sheetConfig(); }
  else if (a === 'config-save'){ await doSaveConfig(); }
  else if (a === 'monitor-url'){ await monitorUrl(); }
  else if (a === 'toggle-key'){
    const inp = document.getElementById('cf-key'), occhio = document.getElementById('cf-key-eye');
    if (inp){
      const mostra = inp.type === 'password';
      inp.type = mostra ? 'text' : 'password';
      if (occhio) occhio.textContent = mostra ? '🙈 Nascondere la chiave' : '👁️ Mostrare la chiave';
    }
  }
  else if (a === 'pass-save'){
    const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1.length < 8){ toast('Minimo 8 caratteri'); return; }
    if (p1 !== p2){ toast('Le due password non coincidono'); return; }
    const sb = client();
    const r = await sb.auth.updateUser({password: p1});
    if (r.error){ toast('Cambio password fallito: ' + msg(r.error)); return; }
    closeSheet(); toast('Password aggiornata ✓');
  }
  else if (a === 'logout'){
    const sb = client();
    await sb.auth.signOut();
    S.movimenti = []; S.categorie = []; S.caricato = false; S.user = null;
    showLogin();
  }
  else if (a === 'export'){
    const csv = buildCsv(S.movimenti, S.categorie);
    const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = 'movimenti-' + todayISO() + '.csv';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('CSV pronto (' + S.movimenti.length + ' movimenti)');
  }
  else if (a === 'filtro'){ S.filtroTipo = v; render(); }
  else if (a === 'home-month'){ S.meseHome = v; render(); }
  else if (a === 'vedi-mese'){ S.meseSel = homeMonth(); S.filtroTipo = 'tutti'; S.ricerca = ''; S.view = 'movimenti'; syncTabs(); render(); window.scrollTo(0,0); }
  else if (a === 'add-in-month'){ sheetMovimento(null, homeMonth() + '-01'); }
  else if (a === 'pick-month'){ S.meseSel = v; S.view = 'movimenti'; syncTabs(); render(); window.scrollTo(0,0); }
  else if (a === 'coda-invia'){ await svuotaCoda(false); }
  else if (a === 'coda-scarta'){
    if (window.confirm('Scartare i ' + nInCoda() + ' movimenti in attesa? Non verranno mai inviati.')){ scriviCoda([]); aggiornaBannerCoda(); toast('Coda svuotata'); }
  }
  else if (a === 'import-csv'){ sheetImport(); }
  else if (a === 'imp-scegli'){ document.getElementById('csv-input').click(); }
  else if (a === 'imp-toggle'){
    if (S.imp){ if (v === 'dup') S.imp.dup = !S.imp.dup; if (v === 'crea') S.imp.creaCat = !S.imp.creaCat; mostraAnteprimaImport(); }
  }
  else if (a === 'imp-vai'){ await eseguiImport(); }
  ev.preventDefault();
});

document.addEventListener('click', (ev) => {
  const seg = ev.target.closest ? ev.target.closest('#seg-tipo button, #seg-cat button, #seg-quale button') : null;
  if (!seg) return;
  seg.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  seg.classList.add('on');
  if (seg.parentNode.id === 'seg-tipo'){
    const cats = document.getElementById('f-cats');
    if (cats){ cats.innerHTML = catButtons(seg.getAttribute('data-v'), null); S.pickCat = null; }
  }
});

document.getElementById('file-input').addEventListener('change', async function(){
  const files = this.files;
  if (files && files.length) await handleFiles(files);
  this.value = '';
});

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  S.view = b.getAttribute('data-view'); syncTabs(); render(); window.scrollTo(0,0);
}));
document.getElementById('btn-add').addEventListener('click', () => sheetMovimento(null));
document.getElementById('btn-profile').addEventListener('click', () => { S.view = 'profilo'; syncTabs(); render(); });

function syncTabs(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.getAttribute('data-view') === S.view));
  document.getElementById('btn-add').style.display = (S.view === 'profilo') ? 'none' : 'flex';
}

/* ============================================================
   12. AUTH + AVVIO
   ============================================================ */
/* ---------------------------------------------------------
   Apertura "da app": la schermata di login sparisce subito,
   appare quella di benvenuto e, sotto, l'app si prepara.
   ------------------------------------------------------- */
let splashTimer = null;
function mostraSplash(ms){
  const el = document.getElementById('splash');
  if (!el) return;
  clearTimeout(splashTimer);
  const ridotto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (ridotto || !ms || ms <= 0){ el.hidden = true; return; }
  el.hidden = false;
  el.style.animation = 'none';
  void el.offsetWidth;                    // riavvia l'animazione di uscita
  el.style.animation = '';
  splashTimer = setTimeout(() => { el.hidden = true; }, ms);
}
function nascondiSplash(){
  clearTimeout(splashTimer);
  const el = document.getElementById('splash');
  if (el) el.hidden = true;
}
/** Nasconde il login, mostra l'app sotto lo splash e avvia l'animazione. */
function avviaApertura(anim){
  document.getElementById('login').hidden = true;
  const app = document.getElementById('app');
  app.hidden = false;
  const attivo = document.activeElement;
  if (attivo && attivo.blur && attivo !== document.body) attivo.blur();
  app.classList.remove('apre');
  if (anim !== false){ void app.offsetWidth; app.classList.add('apre'); }
  window.scrollTo(0, 0);
  segnaAttivita();
  mostraSplash(anim === false ? 0 : 520);
}
function showLogin(){
  nascondiSplash();
  document.getElementById('app').hidden = true;
  document.getElementById('app').classList.remove('apre');
  document.getElementById('login').hidden = false;
  window.scrollTo(0, 0);
  const e = document.getElementById('li-email');
  if (e && !e.value) e.value = window.localStorage.getItem('conto_email') || '';
  const h = document.getElementById('li-cfg-hint');
  if (h) h.hidden = configPronta();
}
/** Carica i dati e poi chiude lo splash: l'app appare pronta. */
async function attendiApertura(anim){
  const attesa = anim === false ? 0 : 520;
  const caricamento = afterAuth(S.user, anim);
  const limite = new Promise((ok) => setTimeout(ok, 6000));
  await Promise.race([caricamento, limite]);
  await new Promise((ok) => setTimeout(ok, Math.max(0, attesa - 260)));
  nascondiSplash();
  window.scrollTo(0, 0);
}

function loginError(text){
  const el = document.getElementById('li-err');
  el.textContent = text; el.classList.add('show');
}
async function doLogin(){
  const btn = document.getElementById('li-btn');
  const email = document.getElementById('li-email').value.trim();
  const pass = document.getElementById('li-pass').value;
  if (!email || !pass){ loginError('Scrivi email e password.'); return; }
  btn.disabled = true; btn.textContent = 'Verifico…'; loginError('');
  S.accedendo = true;   // durante il login l'evento automatico SIGNED_IN va ignorato (ci pensa questa funzione)
  try {
    const sb = client();
    const r = await sb.auth.signInWithPassword({email: email, password: pass});
    if (r.error) throw r.error;
    if (String(r.data.user.email).toLowerCase() !== CFG.EMAIL_OWNER.toLowerCase()){
      await sb.auth.signOut();
      throw new Error('Questo account non è abilitato su quest’app. L’accesso è riservato a ' + CFG.EMAIL_OWNER + '.');
    }
    window.localStorage.setItem('conto_email', email);
    document.getElementById('li-pass').value = '';
    S.user = r.data.user;
    avviaApertura(true);
    await attendiApertura(true);
  } catch (e){
    loginError(msg(e, 'Accesso non riuscito.'));
  } finally {
    btn.disabled = false; btn.textContent = 'Entra';
    S.accedendo = false;
  }
}
async function doReset(){
  const email = document.getElementById('li-email').value.trim();
  if (!email){ loginError('Scrivi prima la tua email, poi premi di nuovo.'); return; }
  try {
    const r = await client().auth.resetPasswordForEmail(email);
    if (r.error) throw r.error;
    loginError(''); toast('Email di reset inviata a ' + email + ' (controlla anche spam).');
  } catch (e){ loginError(msg(e)); }
}
async function afterAuth(user, conAnimazione){
  S.user = user;
  if (conAnimazione !== true) avviaApertura(true);
  try { await loadAll(); render(); segnaAttivita(); svuotaCoda(true); pulisciTemporanei().catch(() => {}); }
  catch (e){
    if (/CONFIG|LIB/.test(String(e && e.message))){
      loginError('Configurazione mancante: inserisci URL e chiave di Supabase nel file index.html (sezione CONFIGURAZIONE).');
      showLogin(); return;
    }
    document.getElementById('content').innerHTML =
      '<div class="card"><h2>Problema nel caricare i dati</h2><div class="err show">' + esc(msg(e, 'Riprova.')) + '</div>' +
      '<button class="btn" onclick="location.reload()">Ricarica</button></div>';
  }
}
async function boot(){
  if (/^https?:/.test(location.protocol) && location.protocol !== 'https:' && !/localhost|127\.|^file:/.test(location.host)) {
    /* http è ok solo in locale */
  }
  let sb;
  try { sb = client(); }
  catch (e){
    document.getElementById('app').hidden = true;
    document.getElementById('login').hidden = false;
    loginError(String(e.message) === 'CONFIG'
      ? 'App ancora da configurare: premi “Impostazioni” e incolla URL, chiave anon public e la tua email.'
      : 'Libreria Supabase non caricata: ricarica la pagina.');
    return;
  }
  collegaAuth(sb);
  const r = await sb.auth.getSession();
  if (r.data && r.data.session && r.data.session.user){
    const u = r.data.session.user;
    if (String(u.email).toLowerCase() !== CFG.EMAIL_OWNER.toLowerCase()){ await sb.auth.signOut(); showLogin(); return; }
    S.user = u;
    avviaApertura(true);
    await attendiApertura(true);
  } else showLogin();
}
document.getElementById('li-btn').addEventListener('click', doLogin);
document.getElementById('li-reset').addEventListener('click', doReset);
document.getElementById('li-config').addEventListener('click', () => sheetConfig());
document.getElementById('li-cfg-hint')?.addEventListener('click', () => sheetConfig());
document.getElementById('li-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('li-email').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('li-pass').focus(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  // updateViaCache 'none': iPhone a volte tiene in cache anche lo script del
  // service worker, e senza questo non lo riconsidera mai
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(() => {
    const r = navigator.serviceWorker.getRegistration();
    if (r && r.then) r.then(x => { if (x && x.update) x.update().catch(() => {}); });
  }).catch(() => {});
}
// app aperta e app chiusa da un pezzo: prima cosa, controlla se online c'e' una novita'
setTimeout(() => { if (S.user) cercaAggiornamento(true); }, 1500);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.user) cercaAggiornamento(true);
});
window.addEventListener('online', () => { if (S.user){ svuotaCoda(true); invalidate(); reload().catch(() => {}); } });
boot();
</script>
