# Tiene sveglio il progetto Supabase.
# Il piano gratuito lo sospende dopo 7 giorni senza attività: questo file fa un
# controllo ogni 8 ore. È un rinforzo: il monitor di UptimeRobot (passo 4.2 del
# manuale) è quello che conta davvero.
name: heartbeat

on:
  schedule:
    - cron: '17 */8 * * *'      # ogni 8 ore e 17 minuti
  workflow_dispatch: {}         # si può lanciare a mano dalla scheda Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Controllo che il progetto Supabase sia attivo
        run: |
          URL="https://ajqqqmnzariqblldxvto.supabase.co/auth/v1/health"
          case "$URL" in
            *ABCDEFGHIJ*)
              echo "Non hai ancora sostituito ABCDEFGHIJ con il tuo progetto: nessun controllo eseguito."
              exit 0
              ;;
          esac
          codice=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL")
          echo "auth/v1/health -> HTTP $codice"
          if [ "$codice" = "200" ]; then
            echo "Progetto attivo: nessuna azione necessaria."
          else
            echo "Il progetto non risponde (HTTP $codice). Se il piano gratuito lo ha sospeso,"
            echo "riattivalo da Supabase -> Project Settings -> General -> Resume."
          fi
